     role="img"
     aria-labelledby="publications-title">
  <title id="publications-title">
    Books, papers, and mathematical publications
  </title>

  
  <style>
    .outline {
      fill: none;
      stroke: #17355d;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .thin {
      fill: none;
      stroke: #2f4ed8;
