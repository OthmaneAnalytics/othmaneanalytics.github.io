    }

    .pale-blue {
      fill: #f4f7ff;
    }

    .teal {
      fill: #0f6f72;
    }

    .pale-teal {
      fill: #dceff0;
    }

    .orange {
      fill: #f28c28;
    }

    .pale-orange {
      fill: #fde6cc;
    }

    .navy {
      fill: #17355d;
    }

    .white {
      fill: #ffffff;
    }
  </style>


