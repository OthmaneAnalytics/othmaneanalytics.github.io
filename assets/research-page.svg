<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 960 500"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">
    Stochastic systems, optimal transport, and PDE methods
  </title>

  <desc id="description">
    A landscape mathematical illustration showing probability
    distributions, transport paths, stochastic trajectories,
    and a PDE contour surface.
  </desc>

  <defs>

    <linearGradient
      id="blueWash"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#dce5ff"/>
    </linearGradient>

    <linearGradient
      id="tealWash"
      x1="0"
      y1="1"
      x2="1"
      y2="0"
    >
      <stop offset="0" stop-color="#e5f2f2"/>
      <stop offset="1" stop-color="#cce6e7"/>
    </linearGradient>

    <linearGradient
      id="surfaceWash"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#6f83e8"
        stop-opacity=".72"
      />
      <stop
        offset="1"
        stop-color="#2f4ed8"
        stop-opacity=".12"
      />
    </linearGradient>

    <filter
      id="softShadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-color="#24333c"
        flood-opacity=".10"
      />
    </filter>

  </defs>


  <rect
    width="960"
    height="500"
    fill="#ffffff"
  />


  <!--
    Decorative background arcs copied from the visual language
    of the original portrait illustration.
  -->

  <path
    d="
      M30 112
      C155 25 270 58 356 128
      C445 201 540 195 650 120
      C744 57 831 57 928 106
    "
    fill="none"
    stroke="#d9e1fb"
    stroke-width="30"
    stroke-linecap="round"
    opacity=".75"
  />

  <path
    d="
      M28 416
      C159 337 263 361 350 417
      C448 480 560 451 650 384
      C754 305 841 334 933 391
    "
    fill="none"
    stroke="#e4f0f0"
    stroke-width="34"
