    cy="192"
    rx="102"
    ry="78"
    fill="url(#blueWash)"
    stroke="#17355d"
    stroke-width="5"
  />

  <g fill="#2f4ed8">
    <circle cx="86" cy="168" r="10"/>
    <circle cx="116" cy="126" r="7"/>
    <circle cx="145" cy="156" r="12"/>
    <circle cx="183" cy="133" r="8"/>
    <circle cx="204" cy="179" r="11"/>
    <circle cx="164" cy="211" r="8"/>
    <circle cx="114" cy="225" r="11"/>
