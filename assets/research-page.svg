<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 560 760"
     role="img"
     aria-labelledby="title description">

  <title id="title">
    Stochastic systems, optimal transport, and PDE methods
  </title>

  <desc id="description">
    An abstract mathematical illustration showing interacting probability
    distributions, stochastic trajectories, transport paths, and contour
    surfaces.
  </desc>

  <defs>
    <linearGradient id="blueWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#dce5ff"/>
    </linearGradient>

    <linearGradient id="tealWash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e5f2f2"/>
      <stop offset="1" stop-color="#cce6e7"/>
    </linearGradient>

    <linearGradient id="surfaceWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f83e8" stop-opacity=".72"/>
      <stop offset="1" stop-color="#2f4ed8" stop-opacity=".12"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="12"
        flood-color="#24333c"
        flood-opacity=".12"
      />
    </filter>
  </defs>

  <rect width="560" height="760" fill="#ffffff"/>

  <path
    d="M40 126
       C106 47 194 51 250 122
       C301 187 369 203 522 115"
    fill="none"
    stroke="#d9e1fb"
    stroke-width="38"
    stroke-linecap="round"
  />

  <path
    d="M30 572
