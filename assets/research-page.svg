<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1500 420"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">
    Mathematical research in stochastic systems
  </title>

  <desc id="description">
    Wide illustration combining probability distributions,
    stochastic transport paths, statistical observations,
    optimal control and partial differential equations.
  </desc>

  <defs>

    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.48" stop-color="#f1f6ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>

    <linearGradient id="blueWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f83dc" stop-opacity=".08"/>
      <stop offset=".35" stop-color="#2f4ed8" stop-opacity=".28"/>
      <stop offset=".68" stop-color="#568ee1" stop-opacity=".18"/>
      <stop offset="1" stop-color="#0f6f72" stop-opacity=".06"/>
    </linearGradient>

    <linearGradient id="tealWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f6f72" stop-opacity=".04"/>
      <stop offset=".42" stop-color="#0f6f72" stop-opacity=".17"/>
      <stop offset=".75" stop-color="#2f4ed8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#2f4ed8" stop-opacity=".03"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="11"/>
    </filter>

    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path
        d="M 0 0 L 10 5 L 0 10 z"
        fill="#f28c28"
      />
    </marker>

  </defs>


  <!-- Background -->
  <rect
    x="3"
    y="3"
    width="1494"
    height="414"
    rx="18"
    fill="url(#paper)"
  />


  <!-- Soft mathematical landscape spanning the full width -->
  <path
    d="
      M 0 285
      C 105 188, 205 310, 318 215
      C 430 120, 540 330, 652 229
      C 770 122, 886 318, 1000 213
      C 1118 104, 1234 312, 1500 194
      L 1500 420
      L 0 420 Z
    "
    fill="url(#blueWave)"
  />

  <path
    d="
      M 0 332
      C 140 242, 246 357, 378 276
      C 512 194, 624 358, 755 273
      C 890 186, 1012 352, 1151 265
      C 1288 179, 1389 283, 1500 238
      L 1500 420
      L 0 420 Z
    "
    fill="url(#tealWave)"
  />


  <!-- Left probability density -->
  <path
    d="
      M 42 289
      C 93 286, 116 270, 144 228
      C 177 178, 197 108, 237 103
      C 278 98, 297 171, 331 222
      C 361 267, 387 286, 431 289
    "
    fill="none"
    stroke="#2f4ed8"
    stroke-width="4"
    stroke-linecap="round"
  />

  <path
    d="
      M 44 289
      C 94 285, 117 269, 145 228
      C 178 178, 198 109, 237 103
      C 278 98, 297 170, 332 222
      C 362 267, 388 286, 432 289
    "
    fill="none"
    stroke="#7e91e8"
    stroke-width="18"
    stroke-linecap="round"
    opacity=".14"
  />


  <!-- Statistical observations -->
  <g fill="#2f4ed8" opacity=".9">

    <circle cx="73" cy="274" r="5"/>
    <circle cx="111" cy="251" r="5"/>
    <circle cx="151" cy="217" r="5"/>
    <circle cx="190" cy="151" r="5"/>
    <circle cx="237" cy="104" r="6"/>
    <circle cx="281" cy="155" r="5"/>
    <circle cx="323" cy="224" r="5"/>
    <circle cx="374" cy="271" r="5"/>

  </g>


  <!-- Network / dependence structure -->
  <g
    stroke="#3155bd"
    stroke-width="1.6"
    opacity=".54"
  >

    <line x1="350" y1="102" x2="422" y2="76"/>
    <line x1="350" y1="102" x2="419" y2="141"/>
    <line x1="422" y1="76" x2="480" y2="119"/>
    <line x1="419" y1="141" x2="480" y2="119"/>
    <line x1="480" y1="119" x2="544" y2="82"/>
    <line x1="480" y1="119" x2="548" y2="158"/>
    <line x1="544" y1="82" x2="605" y2="117"/>
    <line x1="548" y1="158" x2="605" y2="117"/>

  </g>

  <g fill="#17479d">

    <circle cx="350" cy="102" r="5"/>
    <circle cx="422" cy="76" r="5"/>
    <circle cx="419" cy="141" r="5"/>
    <circle cx="480" cy="119" r="6"/>
    <circle cx="544" cy="82" r="5"/>
    <circle cx="548" cy="158" r="5"/>
    <circle cx="605" cy="117" r="6"/>

  </g>


  <!-- Stochastic paths through the whole central canvas -->
  <path
    d="
      M 267 233
      C 369 169, 450 296, 552 225
      C 650 157, 735 283, 833 214
      C 932 145, 1028 281, 1134 202
      C 1225 134, 1318 246, 1453 178
    "
    fill="none"
    stroke="#3866c6"
    stroke-width="2.4"
    opacity=".76"
  />

  <path
    d="
      M 263 257
      C 382 339, 464 164, 577 251
      C 682 333, 777 151, 890 246
      C 992 333, 1101 153, 1212 242
      C 1294 307, 1370 213, 1458 234
    "
    fill="none"
    stroke="#0f6f72"
    stroke-width="2.3"
    opacity=".72"
  />

  <path
    d="
      M 261 275
      C 368 236, 469 312, 579 274
      C 693 233, 779 312, 897 271
      C 1012 231, 1106 303, 1220 265
      C 1314 233, 1380 271, 1462 251
    "
    fill="none"
    stroke="#6d84dc"
    stroke-width="1.8"
    stroke-dasharray="6 8"
    opacity=".72"
  />


  <!-- Orange optimal-control trajectory -->
  <path
    d="
      M 332 307
      C 451 249, 538 326, 650 278
      C 759 232, 849 310, 960 260
      C 1073 210, 1161 286, 1271 241
      C 1342 212, 1397 214, 1456 194
    "
    fill="none"
    stroke="#f28c28"
    stroke-width="3.2"
    stroke-linecap="round"
    marker-end="url(#arrow)"
  />

  <g fill="#f28c28">

    <circle cx="332" cy="307" r="5"/>
    <circle cx="650" cy="278" r="5"/>
    <circle cx="960" cy="260" r="5"/>
    <circle cx="1271" cy="241" r="5"/>

  </g>


  <!-- PDE / computational surface on right -->
  <g
    transform="translate(1085 65)"
    fill="none"
  >

    <path
      d="
        M 0 175
        C 48 168, 64 96, 106 78
        C 145 61, 163 117, 202 128
        C 242 139, 258 93, 304 70
        C 343 50, 374 84, 402 105
      "
      stroke="#2f4ed8"
      stroke-width="3"
    />

    <path
      d="
        M 0 198
        C 51 187, 72 129, 111 111
        C 151 92, 173 146, 211 151
        C 252 156, 273 119, 311 96
        C 349 73, 378 102, 405 124
      "
      stroke="#0f6f72"
      stroke-width="2.5"
    />

    <path
      d="
        M 0 220
        C 54 209, 80 164, 119 144
        C 157 125, 186 171, 221 176
        C 263 181, 289 151, 323 131
        C 360 109, 383 127, 407 145
      "
      stroke="#f28c28"
      stroke-width="2.2"
      opacity=".82"
    />

  </g>


  <!-- Fine computational grid -->
  <g
    stroke="#8da5c8"
    stroke-width="1"
    opacity=".22"
  >

    <path d="M1050 74 H1470"/>
    <path d="M1050 110 H1470"/>
    <path d="M1050 146 H1470"/>
    <path d="M1050 182 H1470"/>
    <path d="M1050 218 H1470"/>
    <path d="M1050 254 H1470"/>

    <path d="M1090 54 V284"/>
    <path d="M1150 54 V284"/>
    <path d="M1210 54 V284"/>
    <path d="M1270 54 V284"/>
    <path d="M1330 54 V284"/>
    <path d="M1390 54 V284"/>
    <path d="M1450 54 V284"/>

  </g>


  <!-- Very subtle stochastic particles across entire width -->
  <g fill="#4b77cb" opacity=".28">

    <circle cx="58" cy="151" r="3"/>
    <circle cx="128" cy="114" r="2.5"/>
    <circle cx="309" cy="77" r="3"/>
    <circle cx="459" cy="61" r="2.5"/>
    <circle cx="626" cy="184" r="3"/>
    <circle cx="691" cy="102" r="2.5"/>
    <circle cx="754" cy="158" r="3"/>
    <circle cx="830" cy="92" r="2.5"/>
    <circle cx="914" cy="122" r="3"/>
    <circle cx="1002" cy="83" r="2.5"/>
    <circle cx="1054" cy="177" r="3"/>
    <circle cx="1150" cy="293" r="3"/>
    <circle cx="1245" cy="318" r="2.5"/>
    <circle cx="1370" cy="304" r="3"/>
    <circle cx="1461" cy="285" r="2.5"/>

  </g>

</svg>
